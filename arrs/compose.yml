services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.4.0@sha256:4fd7a166c8f46dd3370a871c250ee577d6c2ae97a0dbe0e3614b5ef736205620
    container_name: prowlarr
    labels:
      - "dash.description=Indexer manager — feeds Sonarr, Radarr, and Bazarr"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config/prowlarr:/config
    networks:
      - proxy
      - internal
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4@sha256:fc0ae3c50f8128b97e84381903ec8d6845c3a569641cb7117c124376cccb57c1
    container_name: radarr
    labels:
      - "dash.description=Movie automation — monitors, downloads, and organises films"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config/radarr:/config
      - /data/assets:/data
    networks:
      - proxy
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20@sha256:889dcc58c6aea859033985894b519b2e6b1e55d92527ed123f9f52e42ae7c97b
    container_name: sonarr
    labels:
      - "dash.description=TV show automation — monitors, downloads, and organises episodes"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config/sonarr:/config
      - /data/assets:/data
    networks:
      - proxy
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.6@sha256:047222423d6d8556a88581b189175bec57f286f120b52ba29c0390fe6babaa5a
    container_name: bazarr
    labels:
      - "dash.description=Subtitle automation for Sonarr and Radarr"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config/bazarr:/config
      - /data/assets:/data
    networks:
      - proxy
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Africa/Cairo
    networks:
      - internal
    volumes:
      - ./config/flaresolver:/config
    restart: unless-stopped

networks:
  proxy:
    external: true
  internal:
    internal: true
