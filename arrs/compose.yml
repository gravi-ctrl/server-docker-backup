services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.3.5@sha256:c9fe528f34b1fd3715438b6f6d6991d64e2965f2c055db36398bc66a0e7eab01
    container_name: prowlarr
    labels:
      - "dash.description=Indexer manager — feeds Sonarr, Radarr, and Bazarr"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config/prowlarr:/config
    networks:
      - proxy
      - internal
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.1.1@sha256:c0a4335d4249b46102f64cf6fa27ffc3bddfd9138fac1e4ddf238afd37f02d1f
    container_name: radarr
    labels:
      - "dash.description=Movie automation — monitors, downloads, and organises films"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config/radarr:/config
      - /data/assets:/data
    networks:
      - proxy
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17@sha256:0b5c4803f92456fb9b65bae8375716ea120b4ea17b3cced7da32b63f0085782b
    container_name: sonarr
    labels:
      - "dash.description=TV show automation — monitors, downloads, and organises episodes"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config/sonarr:/config
      - /data/assets:/data
    networks:
      - proxy
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.6@sha256:95f27692c3de6dbe130cd035d342d8138ec74ade7b62cfc52e11ae222c52c855
    container_name: bazarr
    labels:
      - "dash.description=Subtitle automation for Sonarr and Radarr"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config/bazarr:/config
      - /data/assets:/data
    networks:
      - proxy
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-none}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=Africa/Cairo
    networks:
      - internal
    volumes:
      - ./config/flaresolver:/config
    restart: unless-stopped

networks:
  proxy:
    external: true
  internal:
    internal: true
