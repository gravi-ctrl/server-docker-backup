services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: Homeserver
    networks:
      - proxy
    environment:
      - PUID=1000
      - PGID=1000
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - ./config:/var/syncthing/config
      - /data:/data
    restart: unless-stopped

networks:
  proxy:
    external: true    
