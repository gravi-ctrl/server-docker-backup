services:
  syncthing:
    image: syncthing/syncthing:2.1@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
    container_name: syncthing
    hostname: Wonderland
    networks:
      - proxy
    ports:
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    environment:
      - PUID=1000
      - PGID=1000
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - ./config:/var/syncthing/config
      - /data:/data
    restart: unless-stopped

networks:
  proxy:
    external: true
