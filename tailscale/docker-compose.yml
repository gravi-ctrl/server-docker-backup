services:
  tailscale:
    container_name: tailscaled
    image: tailscale/tailscale:latest
    hostname: Homeserver # This is the name that will show in your Tailscale dashboard
    network_mode: host # Critical for performance and Subnet Routing
    restart: unless-stopped
    cap_add:
      - NET_ADMIN # Required to create the VPN tunnel
      - NET_RAW
    volumes:
      - ./config:/var/lib/tailscale # Saves your login state so you don't re-auth on reboot
      - /dev/net/tun:/dev/net/tun # Gives access to the network tuner
    environment:
      # To generate a new key — if needed, go to https://login.tailscale.com/admin/settings/keys, then 'Generate auth key...', make sure to tick 'Reusable' and 'Tags' and select a tag, then Generate key
      - TS_AUTHKEY=${AUTH_KEY}
      - TS_EXTRA_ARGS=--advertise-routes=192.168.1.0/24
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SOCKS5_SERVER=:1055
networks: {}
