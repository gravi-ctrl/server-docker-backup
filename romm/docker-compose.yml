services:
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm
      - DB_PASSWD=${DB_MYSQL_PASS}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_KEY}
      - IGDB_CLIENT_ID=${IGDB_TWITCH_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_TWITCH_CLIENT_SECRET}
      - REDIS_HOST=romm-redis
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - /srv/data/assets/romm/resources:/romm/resources
      - ./config:/romm/config
      - ./assets:/romm/assets
      # the roms need to be in a folder called 'roms' inside each platform folder (e.g. romm/library/snes/roms)
      - /srv/data/assets/romm/library:/romm/library
    ports:
      - 8083:8080
    depends_on:
      romm-db:
        condition: service_healthy
      romm-redis:
        condition: service_started
  romm-db:
    image: mariadb:lts
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MYSQL_PASS}
      - MARIADB_DATABASE=romm
      - MARIADB_USER=romm
      - MARIADB_PASSWORD=${DB_MYSQL_PASS}
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      start_period: 180s
      interval: 20s
      timeout: 5s
      retries: 10
  romm-redis:
    image: redis:alpine
    container_name: romm-redis
    restart: unless-stopped
networks: {}
