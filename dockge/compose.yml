services:
  dockge:
    image: louislam/dockge:latest
    container_name: dockge
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # This tells Dockge that your "stacks" live in /opt
      - /opt/stacks:/opt/stacks
    environment:
      # Tell Dockge where stacks are internally
      - DOCKGE_STACKS_DIR=/opt/stacks
networks:
  proxy:
    external: true
