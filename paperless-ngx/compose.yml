services:
  broker:
    image: docker.io/library/redis:8.10-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - ./redisdata:/data
    networks:
      - internal
  db:
    image: docker.io/library/postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    container_name: paperless-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${POSTGRES_DBPASS}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - ./pgdata:/var/lib/postgresql
    networks:
      - internal
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
    container_name: paperless-ngx
    labels:
      - "dash.description=Document scanning and archival. Uses TG workflow through n8n"
      - "deploy.rollback=false"
    restart: unless-stopped
    depends_on:
      - db
      - broker
    networks:
      - proxy
      - internal
    environment:
      - USERMAP_UID=1000
      - USERMAP_GID=1000
      # pocket-id support
      - PAPERLESS_APPS=allauth.socialaccount.providers.openid_connect
      - PAPERLESS_SOCIALACCOUNT_PROVIDERS={"openid_connect":{"APPS":[{"provider_id":"pocket-id","name":"Pocket ID","client_id":"${PAPERLESS_OIDC_CLIENT_ID}","secret":"${PAPERLESS_OIDC_CLIENT_SECRET}","settings":{"server_url":"https://pocket.wonder.lan/.well-known/openid-configuration"}}]}}
      - PAPERLESS_SOCIALACCOUNT_AUTO_SIGNUP=true
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      # Note: In n8n, the API is added like: Token <API> with a space between
      - PAPERLESS_REDIS=redis://broker:6379
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBPASS=${POSTGRES_DBPASS}
      - PAPERLESS_SECRET_KEY=${PAPER_SECRET_KEY}
      - PAPERLESS_TIME_ZONE=Africa/Cairo
      - PAPERLESS_WEBSERVER_WORKERS=1
      - PAPERLESS_TASK_WORKERS=1
      - PAPERLESS_THREADS_PER_WORKER=1
      - PAPERLESS_OCR_LANGUAGE=ara+eng
      - PAPERLESS_OCR_LANGUAGES=ara eng
      - PAPERLESS_URL=https://paperless.wonder.lan
      - PAPERLESS_FILENAME_FORMAT={{ tag_list }}/{{ created_year }}/{{ created
        }}-{{ title }}
    volumes:
      - /data/paperless/data:/usr/src/paperless/data
      - /data/paperless/media:/usr/src/paperless/media
      - /data/assets/syncthing/DCIM/paperless-scan:/usr/src/paperless/consume:rw
      - ./custom-tessdata/ara.traineddata:/usr/share/tesseract-ocr/5/tessdata/ara.traineddata:ro
      - ./custom-tessdata/eng.traineddata:/usr/share/tesseract-ocr/5/tessdata/eng.traineddata:ro
      - ${HOST_CERT_PATH}:/usr/local/share/ca-certificates/homeserver-ca.crt:ro
      - ./custom-cont-init.d:/custom-cont-init.d:ro  # My CA certificate
    env_file: docker-compose.env

networks:
  proxy:
    external: true
  internal:
    internal: true
