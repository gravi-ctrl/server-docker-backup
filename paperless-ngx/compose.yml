services:
  broker:
    image: docker.io/library/redis:8.6-alpine@sha256:d103b9cd0b54b98b2c38e2b19220ee7adfe4b0fb22c406baa75f321179da2f00
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - ./redisdata:/data
    networks:
      - internal
  db:
    image: docker.io/library/postgres:18.4@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
    container_name: paperless-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${POSTGRES_DBPASS}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - ./pgdata:/var/lib/postgresql
    networks:
      - internal
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15@sha256:6c86cad803970ea782683a8e80e7403444c5bf3cf70de63b4d3c8e87500db92f
    container_name: paperless-ngx
    labels:
      - "dash.description=Document scanning and archival"
    restart: unless-stopped
    depends_on:
      - db
      - broker
    networks:
      - proxy
      - internal
    environment:
      - USERMAP_UID=1000
      - USERMAP_GID=1000
      # pocket-id support
      - PAPERLESS_APPS=allauth.socialaccount.providers.openid_connect
      - PAPERLESS_SOCIALACCOUNT_PROVIDERS={"openid_connect":{"APPS":[{"provider_id":"pocket-id","name":"Pocket ID","client_id":"${PAPERLESS_OIDC_CLIENT_ID}","secret":"${PAPERLESS_OIDC_CLIENT_SECRET}","settings":{"server_url":"https://pocket.wonder.lan/.well-known/openid-configuration"}}]}}
      - PAPERLESS_SOCIALACCOUNT_AUTO_SIGNUP=true
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      # Note: In n8n, the API is added like: Token <API> with a space between
      - PAPERLESS_REDIS=redis://broker:6379
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBPASS=${POSTGRES_DBPASS}
      - PAPERLESS_SECRET_KEY=${PAPER_SECRET_KEY}
      - PAPERLESS_TIME_ZONE=Africa/Cairo
      - PAPERLESS_WEBSERVER_WORKERS=1
      - PAPERLESS_TASK_WORKERS=1
      - PAPERLESS_THREADS_PER_WORKER=1
      - PAPERLESS_OCR_LANGUAGE=ara+eng
      - PAPERLESS_OCR_LANGUAGES=ara eng
      - PAPERLESS_URL=https://paperless.wonder.lan
      - PAPERLESS_FILENAME_FORMAT={{ tag_list }}/{{ created_year }}/{{ created
        }}-{{ title }}
    volumes:
      - /data/paperless/data:/usr/src/paperless/data
      - /data/paperless/media:/usr/src/paperless/media
      - /data/assets/syncthing/DCIM/paperless-scan:/usr/src/paperless/consume:rw
      - ./custom-tessdata:/usr/share/tesseract-ocr/5/tessdata
      - ${HOST_CERT_PATH}:/usr/local/share/ca-certificates/homeserver-ca.crt:ro
    command: >
      sh -c "update-ca-certificates && /usr/local/bin/paperless_cmd.sh"
    env_file: docker-compose.env

networks:
  proxy:
    external: true
  internal:
    internal: true
