services:
  jdownloader:
    image: jlesage/jdownloader-2:latest
    container_name: jdownloader
    environment:
      - VNC_PASSWORD=${VNC_PASS}
      - USER_ID=1000
      - GROUP_ID=1000
      #- DISPLAY_WIDTH=720
      #- DISPLAY_HEIGHT=1280
    volumes:
      - ./config:/config
      - /data/assets/downloads:/output:rw
      - /data/assets/downloads/watch:/output/watch:rw
    ports:
      - 127.0.0.1:3129:3129
    networks:
      - proxy      
    restart: unless-stopped
    
networks:
  proxy:
    external: true
