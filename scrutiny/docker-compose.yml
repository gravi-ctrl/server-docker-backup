services:
  scrutiny:
    container_name: scrutiny
    image: ghcr.io/analogj/scrutiny:master-omnibus
    cap_add:
      - SYS_RAWIO # Allow container to query hardware info
    privileged: true
    ports:
      - 8020:8080 # Web UI port
    volumes:
      - /run/udev:/run/udev:ro
      - ./config:/opt/scrutiny/config
      - ./influxdb:/opt/scrutiny/influxdb
    environment:
      - TZ=Africa/Cairo
      - SCRUTINY_NOTIFY_URLS=${TELE_API}
      - SCRUTINY_WEB_INFLUXDB_INIT_TIMEOUT=30s
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8080/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks: {}
