services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    container_name: audiobookshelf
    labels:
      - "dash.description=Audiobook and podcast server"
    networks:
      - proxy
    volumes:
      - ./config:/config
      - ./metadata:/metadata
      - /data/assets/syncthing/Backup/self-hosted/audiobookshelf:/config/backups
      - /data/assets/Media/Books:/audiobooks:rw
      - /data/assets/Media/Podcasts:/podcasts:rw
      - ${HOST_CERT_PATH}:/etc/ssl/certs/homeserver-ca.pem:ro
    environment:
      - TZ=Africa/Cairo
      - AUDIOBOOKSHELF_UID=1000
      - AUDIOBOOKSHELF_GID=1000
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/homeserver-ca.pem
    restart: unless-stopped
networks:
  proxy:
    external: true
