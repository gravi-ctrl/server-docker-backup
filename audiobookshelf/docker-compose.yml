services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.32.1
    container_name: audiobookshelf
    ports:
      - 13378:80
    volumes:
      - ./config:/config
      - ./metadata:/metadata
      - ./backups:/config/backups
      - /srv/data/assets/Media/Books:/audiobooks:rw
      - /srv/data/assets/Media/Podcasts:/podcasts:rw
    environment:
      - TZ=Africa/Cairo
      - AUDIOBOOKSHELF_UID=1000
      - AUDIOBOOKSHELF_GID=1000
    restart: always
networks: {}
