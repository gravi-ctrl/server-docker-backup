        widget:
            type: nextcloud
            url: http://nextcloud:80
            username: {{HOMEPAGE_VAR_NEXTCLOUD_USER}}
            password: {{HOMEPAGE_VAR_NEXTCLOUD_APP_PASS}}

    - Paperless-ngx:
        icon: paperless-ngx.png
        href: https://paperless.wonder.lan
