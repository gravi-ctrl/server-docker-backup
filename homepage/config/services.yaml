- Infrastructure:
    - Pi-hole:
        icon: pi-hole.png
        href: https://pihole.wonder.lan/admin
        description: DNS Filtering
        widget:
            type: pihole
            url: http://pihole:80
            version: 6
            key: {{HOMEPAGE_VAR_PI_API}}

    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.png
        href: https://npm.wonder.lan
        description: Proxy Manager
        widget:
            type: npm
            url: http://192.168.1.109:81
            username: {{HOMEPAGE_VAR_NPM_USER}}
            password: {{HOMEPAGE_VAR_NPM_PASS}}

