- Media & Entertainment:
    - RomM:
        icon: romm
        href: https://romm.wonder.lan
        description: ROM Manager
        widget:
            type: romm
            url: http://romm:8080

    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.wonder.lan
        description: Movies, Series & Music
        widget:
            type: jellyfin
            url: http://jellyfin:8096/
            key: {{HOMEPAGE_VAR_JELLYFIN_KEY}}
            enableBlocks: true
            enableNowPlaying: false
            showEpisodeNumber: true

    - Audiobookshelf:
        icon: audiobookshelf.png
        href: https://audiobooks.wonder.lan
        description: Books
        widget:
            type: audiobookshelf
            url: http://audiobookshelf:80/
            key: {{HOMEPAGE_VAR_AUDIOBOOKSHELF_API}}

- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: https://qbit.wonder.lan
        description: Torrents
        widget:
            type: qbittorrent
            url: http://qbittorrent:8080/
            username: {{HOMEPAGE_VAR_QBIT_USERNAME}}
            password: {{HOMEPAGE_VAR_QBIT_PASS}}

    - JDownloader 2:
        icon: jdownloader.png
        href: https://my.jdownloader.org/
        description: Direct Downloads
        widget:
            type: jdownloader
            username: {{HOMEPAGE_VAR_JD2_USER}}
            password: {{HOMEPAGE_VAR_JD2_PASS}}
            client: Wonderland

- Arrs:
