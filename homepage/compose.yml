services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
    container_name: homepage
    labels:
      - "dash.description=Personal dashboard — links to all services"
    init: true
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ./config:/app/config
      - ./config/images:/app/public/images
    environment:
      - PUID=1000
      - PGID=1000
      - LOG_LEVEL=info
      - HOMEPAGE_ALLOWED_HOSTS=*

networks:
  proxy:
    external: true
