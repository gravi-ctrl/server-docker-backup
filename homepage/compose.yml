services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.1@sha256:d8d784e5090111b6e4c56dfd90e272d2953a2094e87349f647165df0fa6c4401
    container_name: homepage
    labels:
      - "dash.description=Personal dashboard — links to all services"
    init: true
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ./config:/app/config
      - ./config/images:/app/public/images
    environment:
      - PUID=1000
      - PGID=1000
      - LOG_LEVEL=info
      - HOMEPAGE_ALLOWED_HOSTS=*

networks:
  proxy:
    external: true
