services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    container_name: homepage
    labels:
      - "dash.description=Personal dashboard — links to all services"
    init: true
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ./config:/app/config
      - ./config/images:/app/public/images
    environment:
      - PUID=1000
      - PGID=1000
      - LOG_LEVEL=info
      - HOMEPAGE_ALLOWED_HOSTS=*

networks:
  proxy:
    external: true
