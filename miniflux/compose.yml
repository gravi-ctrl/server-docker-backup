services:
  miniflux-db:
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    container_name: miniflux-db
    restart: unless-stopped
    networks:
      - internal
    environment:
      - TZ=Africa/Cairo
      - POSTGRES_USER=${MINIFLUX_DB_USER}
      - POSTGRES_PASSWORD=${MINIFLUX_DB_PASS}
      - POSTGRES_DB=miniflux
    volumes:
      - ./db:/var/lib/postgresql/data

  miniflux:
    image: miniflux/miniflux:2.3.1@sha256:42f14382a035e9d9bbc33910ca53f72d47177f75c3c638d2c5a85adf5582d538
    container_name: miniflux
    labels:
      - "dash.description=Self-hosted RSS reader — daily digest pushed via miniflux-digest.py"
    restart: unless-stopped
    networks:
      - proxy
      - internal
    depends_on:
      - miniflux-db
    ports:
      # Host-local only. Lets miniflux-digest.py (runs on the host via cron, not inside a container) 
      - "127.0.0.1:8090:8080"
    environment:
      - TZ=Africa/Cairo
      - DATABASE_URL=postgres://${MINIFLUX_DB_USER}:${MINIFLUX_DB_PASS}@miniflux-db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=${MINIFLUX_ADMIN_USER}
      - ADMIN_PASSWORD=${MINIFLUX_ADMIN_PASS}

networks:
  proxy:
    external: true
  internal:
    internal: true
