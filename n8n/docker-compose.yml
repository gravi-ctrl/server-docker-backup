services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - 5678:5678
    environment:
      # --- NETWORK CONFIG ---
      - WEBHOOK_URL=https://${NGROK_DOMAIN}
      - GENERIC_TIMEZONE=Africa/Cairo
      # --- SECRETS ---
      # Variables can be added in a workflow like: {{ $env.MY_BOT_TOKEN }}, and choose 'Expression' instead of 'Fixed'
      - MY_BOT_TOKEN=${TELEGRAM_DANTE_TOKEN}
      - MY_2ND_BOT_TOKEN=${TELEGRAM_VERGIL_TOKEN}
      - CHAT_ID=${MY_TELEGRAM_CHAT_ID}
      - SONARR_API=${SON_API}
      - RADARR_API=${RAD_API}
      - QBIT_USER=${QBIT_USER}
      - QBIT_PASS=${QBIT_PASS}
      - PIHOLE_APP_PASS=${PIHOLE_PASS}
      - N8N_ENV_ALLOWLIST=*
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # --- PRIVACY & LOGS ---
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      # --- DATABASE MAINTENANCE ---
      # Keeps the database small and fast
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=24
      - DB_SQLITE_POOL_SIZE=10
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=false
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      # --- SECURITY ---
      - N8N_SECURE_COOKIE=false
      - NODES_EXCLUDE=[]
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # --- PROCESS MANAGEMENT ---
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - ./n8n_data:/home/node/.n8n
      - /srv/data/assets/downloads:/downloads:rw
      - /srv/data/assets/downloads/watch:/watch-folder:rw
  # --- NGROK TUNNEL ---
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_TOKEN}
    # Points the static domain to the n8n container
    command: http n8n:5678 --domain=${NGROK_DOMAIN}
networks: {}
