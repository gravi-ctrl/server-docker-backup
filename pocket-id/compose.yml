services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    container_name: pocket-id
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ./data:/app/data
      - ${HOST_CERT_PATH}:/etc/ssl/certs/homeserver-ca.pem:ro
    environment:
      # First time setting up visit https://pocket.homeserver/setup
      # To by pass the passkey and login with a url, run this: docker exec -it pocket-id /app/pocket-id one-time-access-token <EMAIL_ADDRESS>
      - APP_URL=https://pocket.homeserver
      - TRUST_PROXY=true
      - ANALYTICS_DISABLED=true
      - VERSION_CHECK_DISABLED=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SSL_CERT_FILE=/etc/ssl/certs/homeserver-ca.pem

networks:
  proxy:
    external: true
