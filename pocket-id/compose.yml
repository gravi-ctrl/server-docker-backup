services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.9.0@sha256:a2a38a96699d7483d65b5849b015d954f294938306a03a9c0699bc5b79554e86
    labels:
      - "dash.description=OIDC identity provider — handles SSO via passkeys"
      - "dash.notes=start early on restore"
    container_name: pocket-id
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ./data:/app/data
      - ${HOST_CERT_PATH}:/etc/ssl/certs/homeserver-ca.pem:ro
    environment:
      # First time setting up visit https://pocket.wonder.lan/setup
      # To bypass the passkey and login with a url, run this: docker exec -it pocket-id /app/pocket-id one-time-access-token <EMAIL_ADDRESS>
      - APP_URL=https://pocket.wonder.lan
      - TRUST_PROXY=true
      - ANALYTICS_DISABLED=true
      - VERSION_CHECK_DISABLED=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SSL_CERT_FILE=/etc/ssl/certs/homeserver-ca.pem

networks:
  proxy:
    external: true
