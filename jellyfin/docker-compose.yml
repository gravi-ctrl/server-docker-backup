services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config:/config
      - /srv/data/assets:/data
    ports:
      - 8096:8096
    restart: on-failure:5
networks: {}
