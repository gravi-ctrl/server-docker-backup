services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11@sha256:438e44330078e6b1a810fdec9dc0f4773e6595edb137c5eb4417a516da4c7f0e
    container_name: jellyfin
    labels:
      - "dash.description=Media server — movies, shows, music"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config:/config
      - /data/assets:/data
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
