services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11@sha256:bb8ff21a879498dbdead9efe4d3de2070dbda2b9fb35b9a43501055f6e526384
    container_name: jellyfin
    labels:
      - "dash.description=Media server — movies, shows, music"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config:/config
      - /data/assets:/data
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
