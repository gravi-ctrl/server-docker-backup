services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11@sha256:c123ef2f82195e377d8ca3df275f13f9dfa5c6e61b195958662b42b5e54362ab
    container_name: jellyfin
    labels:
      - "dash.description=Media server — movies, shows, music"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config:/config
      - /data/assets:/data
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
