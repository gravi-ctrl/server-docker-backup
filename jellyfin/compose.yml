services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config:/config
      - /data/assets:/data
    networks:
      - proxy
    restart: unless-stopped
    
networks:
  proxy:
    external: true
