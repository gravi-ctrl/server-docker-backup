services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.10@sha256:be2bd22d5e27451ebc14b326d8a6554e1f51c79f4431d6c71522565ed17f06ea
    container_name: jellyfin
    labels:
      - "dash.description=Media server — movies, shows, music"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
    volumes:
      - ./config:/config
      - /data/assets:/data
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
