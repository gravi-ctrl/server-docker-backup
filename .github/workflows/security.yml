name: Security Scans

# Save as .github/workflows/security.yml in the stacks repo (server-docker-backup).
#
# BEFORE COMMITTING: replace every <FULL_COMMIT_SHA> below with the 40-character commit SHA of
# the trivy-action release you want, and keep the version in the trailing comment. Do NOT use a
# tag. In March 2026 attackers force-pushed 76 of 77 trivy-action version tags to malware; a
# pinned SHA would not have been affected.
#   Find it: https://github.com/aquasecurity/trivy-action/releases -> latest release -> click the
#   short commit hash -> copy the full SHA from the URL.
# Never set `version: latest` for the action.

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '17 4 * * 1'        # weekly: new CVEs show up in images that haven't changed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan repo for committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'

  dockerfile:
    name: Dockerfile Misconfig Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan wifi-robot Dockerfile for bad practices
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: wifi-robot
          severity: HIGH,CRITICAL
          exit-code: '1'

  image:
    name: Image CVE Scan (wifi-robot)
    # The image is built from main, so scan it on pushes, the weekly schedule and manual runs.
    # Don't make this one a required check: a new CVE would block unrelated PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Scan the published image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/gravi-ctrl/wifi-robot:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true      # skip CVEs with no available fix; nothing you can do about them
          exit-code: '1'
