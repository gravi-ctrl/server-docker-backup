name: Refresh n8n Stable Version Allowlist

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: n8n-stable-version-allowlist
  cancel-in-progress: false

jobs:
  refresh:
    name: Generate stable n8n Renovate preset
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate allowlist from GitHub Releases
        env:
          # Read-only token, only used to avoid the 60 req/h unauthenticated API limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 n8n/scripts/generate_n8n_stable_preset.py

      - name: Create or update Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.N8N_AUTOMATION_TOKEN }}
          branch: automation/n8n-stable-allowlist
          base: main
          delete-branch: true
          add-paths: renovate-feed/n8n-stable.json
          commit-message: "chore(renovate): refresh n8n stable versions"
          title: "chore(renovate): refresh n8n stable versions"
          body: |
            Automatically generated update to the n8n stable-version
            allowlist based on GitHub Releases.

            Please review the generated version list before merging.
