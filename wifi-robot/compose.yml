services:
  wifi-robot:
    container_name: wifi-robot
    image: ghcr.io/gravi-ctrl/wifi-robot:latest@sha256:3175cc305f82f7ecc202df11c5a4e89503bf50d604f257aa9c4b362c4d0163fd
    init: true
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

networks:
  proxy:
    external: true

# USAGE:
# docker exec wifi-robot curl -s "http://localhost:5000/on" - turns the Guest WiFi ON
# docker exec wifi-robot curl -s "http://localhost:5000/off" - turns the Guest WiFi OFF
