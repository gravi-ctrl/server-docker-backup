services:
  wifi-robot:
    container_name: wifi-robot
    image: ghcr.io/gravi-ctrl/wifi-robot:latest@sha256:959b08981efbd0e5a13ea6d5b6995aa2d23b0f9ab7f324d78b74a4b5214c4dc3
    init: true
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

networks:
  proxy:
    external: true

# USAGE:
# docker exec wifi-robot curl -s "http://localhost:5000/on" - turns the Guest WiFi ON
# docker exec wifi-robot curl -s "http://localhost:5000/off" - turns the Guest WiFi OFF
