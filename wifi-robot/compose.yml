services:
  wifi-robot:
    image: ghcr.io/gravi-ctrl/wifi-robot:latest@sha256:f9e8ab3727df4984c2b3e394b2db7d5a21999ae081a069c160f284373a703aaa
    container_name: wifi-robot
    init: true
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

networks:
  proxy:
    external: true

# USAGE:
# docker exec wifi-robot curl -s "http://localhost:5000/on" - turns the Guest WiFi ON
# docker exec wifi-robot curl -s "http://localhost:5000/off" - turns the Guest WiFi OFF
