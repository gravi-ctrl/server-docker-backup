services:
  wifi-robot:
    container_name: wifi-robot
    image: ghcr.io/gravi-ctrl/wifi-robot:latest@sha256:47913ae532d7eddb2bd9ea96b7612abf7207f8e7da53c18a8cb5dcf8dbb6367e
    init: true
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

networks:
  proxy:
    external: true

# USAGE:
# docker exec wifi-robot curl -s "http://localhost:5000/on" - turns the Guest WiFi ON
# docker exec wifi-robot curl -s "http://localhost:5000/off" - turns the Guest WiFi OFF
