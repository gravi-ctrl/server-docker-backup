services:
  wifi-robot:
    image: ghcr.io/gravi-ctrl/wifi-robot:latest@sha256:ede985d544fe0cf7955017f3fb890ada81bc56507b5e77fc468e871bded76496
    container_name: wifi-robot
    init: true
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

networks:
  proxy:
    external: true

# USAGE:
# docker exec wifi-robot curl -s "http://localhost:5000/on" - turns the Guest WiFi ON
# docker exec wifi-robot curl -s "http://localhost:5000/off" - turns the Guest WiFi OFF
