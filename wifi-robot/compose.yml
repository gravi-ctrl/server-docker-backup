services:
  wifi-robot:
    container_name: wifi-robot
    image: ghcr.io/gravi-ctrl/wifi-robot:latest@sha256:ab83d016031104083ad29a0713666e268fcc71f4c5c2326c032779acb587428e
    init: true
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

networks:
  proxy:
    external: true

# USAGE:
# docker exec wifi-robot curl -s "http://localhost:5000/on" - turns the Guest WiFi ON
# docker exec wifi-robot curl -s "http://localhost:5000/off" - turns the Guest WiFi OFF
