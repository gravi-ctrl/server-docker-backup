services:
  wifi-robot:
    container_name: wifi-robot
    image: ghcr.io/gravi-ctrl/wifi-robot:latest@sha256:6a97a59213cb6d9fecc355cf04f2bcabf51991a6a28ec2731178ab6f6d9ec0f5
    init: true
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

networks:
  proxy:
    external: true

# USAGE:
# docker exec wifi-robot curl -s "http://localhost:5000/on" - turns the Guest WiFi ON
# docker exec wifi-robot curl -s "http://localhost:5000/off" - turns the Guest WiFi OFF
