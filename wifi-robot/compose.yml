services:
  wifi-robot:
    image: ghcr.io/gravi-ctrl/wifi-robot:latest@sha256:2ac88c221403ce1019f29a02d9b01b3bebd69d7c826c33d1d677370e54febecc
    container_name: wifi-robot
    init: true
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env

networks:
  proxy:
    external: true

# USAGE:
# docker exec wifi-robot curl -s "http://localhost:5000/on" - turns the Guest WiFi ON
# docker exec wifi-robot curl -s "http://localhost:5000/off" - turns the Guest WiFi OFF
