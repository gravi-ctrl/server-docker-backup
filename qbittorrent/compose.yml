services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0@sha256:a8083a3337a175e84374e3c8cf34ab76566c54502a2e8580e53b6deaa5b2f619
    labels:
      - "dash.description=Torrent client"
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
      - WEBUI_PORT=8080
    volumes:
      - ./config:/config
      - /data/assets:/data
    networks:
      - proxy
    ports:
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

networks:
  proxy:
    external: true
