services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4@sha256:1ea873647c43d566f251a7122aee330b184509c57ee3257ed19f62dac0f8f24b
    labels:
      - "dash.description=Torrent client"
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Cairo
      - WEBUI_PORT=8080
    volumes:
      - ./config:/config
      - /data/assets:/data
    networks:
      - proxy
    ports:
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

networks:
  proxy:
    external: true
