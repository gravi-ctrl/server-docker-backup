services:
  app:
    image: jc21/nginx-proxy-manager:2.15.0@sha256:83b8d6a2d5ddfdd1f9f8ee240499953dec5f7bbf3b4dafc5f4ac394f1edca930
    container_name: npm
    labels:
      - "dash.description=Nginx Proxy Manager — reverse proxy and SSL termination"
      - "dash.notes=Core infrastructure — start early on restore"
    restart: unless-stopped
    ports:
      - 80:80
      - 81:81
      - 443:443
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    external: true
