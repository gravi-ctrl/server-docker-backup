services:
  app:
    image: jc21/nginx-proxy-manager:2.17.0@sha256:91277490a919c792aa73b8d291af1ca84d32be74df988e543137976515763534
    container_name: npm
    labels:
      - "dash.description=Nginx Proxy Manager — reverse proxy and SSL termination"
      - "dash.notes=Core infrastructure — start early on restore"
    restart: unless-stopped
    ports:
      - 80:80
      - 81:81
      - 443:443
    environment:
      - TZ=Africa/Cairo
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    external: true
