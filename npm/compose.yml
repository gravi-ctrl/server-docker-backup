services:
  app:
    image: jc21/nginx-proxy-manager:2.17.1@sha256:04a9d0835560b9719ab577275f84fe1f713298a1c1e2bdefa034b87f10e062e1
    container_name: npm
    labels:
      - "dash.description=Nginx Proxy Manager — reverse proxy and SSL termination"
      - "dash.notes=Core infrastructure — start early on restore"
    restart: unless-stopped
    ports:
      - 80:80
      - 81:81
      - 443:443
    environment:
      - TZ=Africa/Cairo
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true
