services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    dns:
      - 1.1.1.1
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 8081:80/tcp
    environment:
      - TZ=Africa/Cairo
      - WEBPASSWORD=${PASS}
      - ADDITIONAL_PACKAGES=python3 curl
      - CHECK_LOAD=false
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped
networks: {}
