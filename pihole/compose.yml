services:
  pihole:
    container_name: pihole
    labels:
      - "dash.description=DNS-level ad blocking and LAN resolver"
      - "dash.notes=Acts as DNS for the whole network — start early on restore"
    image: pihole/pihole:2026.06.0@sha256:8ea95136e7c8c15b42d88eadf1a3875421aa1be30ad39e50f661188cc986fb27
    dns:
      - 1.1.1.1
    ports:
      - 53:53/tcp
      - 53:53/udp
      # To access pihole using ip:port - if needed, uncomment the below port and head to
      # http://192.168.1.109:8081/admin
      #- 8081:80/tcp
    networks:
      - proxy
      - default
    environment:
      - TZ=Africa/Cairo
      - FTLCONF_webserver_api_password=${PASS}
      - ADDITIONAL_PACKAGES=python3 curl
      - CHECK_LOAD=false
      - FTLCONF_database_maxDBdays=7
      - FTLCONF_dns_upstreams=172.20.0.1#5335
      - FTLCONF_dns_listeningMode=all
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped

networks:
  proxy:
    external: true
