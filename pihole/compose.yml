services:
  pihole:
    container_name: pihole
    labels:
      - "dash.description=DNS-level ad blocking and LAN resolver"
      - "dash.notes=Acts as DNS for the whole network — start early on restore"
    image: pihole/pihole:2026.05.0@sha256:70a9c11171ded2eee735d88c127996da209284a329d50f5ae59c06b861d401b3
    dns:
      - 1.1.1.1
    ports:
      - 53:53/tcp
      - 53:53/udp
      # IF NEEDED, uncomment the below port and access pihole through
      # http://192.168.1.109:8081/admin
      #- 8081:80/tcp
    networks:
      - proxy
    environment:
      - TZ=Africa/Cairo
      - WEBPASSWORD=${PASS}
      - ADDITIONAL_PACKAGES=python3 curl
      - CHECK_LOAD=false
      - FTLCONF_database_maxDBdays=7
      - PIHOLE_DNS_=172.20.0.1#5335
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped

networks:
  proxy:
    external: true
