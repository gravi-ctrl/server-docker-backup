services:
  db:
    image: mariadb:lts
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ./db:/var/lib/mysql
    networks:
      - internal
    environment:
      - MYSQL_ROOT_PASSWORD=${ROOT_PASS}
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}
  app:
    build: .          # ⚠️ Custom image — DO NOT use docker pull
                      # To update: docker compose build --no-cache && docker compose up -d
                      # Reason: mariadb-client needed for calcardbackup
    container_name: nextcloud
    restart: unless-stopped
    networks:
      - proxy
      - internal
    links:
      - db
    volumes:
      - ./html:/var/www/html
      - /data/assets/nextcloud_data:/var/www/html/data
      - /data/assets:/mnt/external_files
      - ./calcardbackup:/usr/local/bin/calcardbackup:ro
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}
      - MYSQL_HOST=db
      - NEXTCLOUD_DATA_DIR=/var/www/html/data

networks:
  proxy:
    external: true
  internal:
    internal: true
