services:
  db:
    image: mariadb:lts
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ./db:/var/lib/mysql
    networks:
      - internal
    environment:
      - TZ=Africa/Cairo
      - MYSQL_ROOT_PASSWORD=${ROOT_PASS}
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}

  redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - internal

  app:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    networks:
      - proxy
      - internal
    depends_on:
      - db
      - redis
    volumes:
      - ./html:/var/www/html
      - /data/nextcloud_data:/var/www/html/data
      - /data/assets:/mnt/external_files
    environment:
      - TZ=Africa/Cairo
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}
      - MYSQL_HOST=db
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
      - REDIS_HOST=redis

  calcardbackup:
    image: waja/calcardbackup
    container_name: calcardbackup
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - db
      - app
    environment:
      - NC_DIR=/var/www/html
      - DB_HOST=db
      - CRON_TIME="59 23 31 12 *"
      - CALCARD_OPTS=-s
    volumes:
      - ./html:/var/www/html:ro
      - /data/assets:/backup
      - /usr/share/zoneinfo/Africa/Cairo:/etc/localtime:ro

networks:
  proxy:
    external: true
  internal:
    internal: true
