services:
  db:
    image: mariadb:lts
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ./db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${ROOT_PASS}
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}
    ports:
      - 127.0.0.1:3306:3306 # for calcardbackup to work
  app:
    image: nextcloud:latest
    restart: unless-stopped
    ports:
      - 8080:80
    links:
      - db
    volumes:
      - ./html:/var/www/html
      - /data/assets/nextcloud_data:/var/www/html/data
      - /data/assets:/mnt/external_files
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}
      - MYSQL_HOST=db
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
networks: {}
