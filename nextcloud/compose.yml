services:
  db:
    image: mariadb:11.8@sha256:be1ef4fe5f14589325c08a41c76334097ce66c86264b75e1d28342c742782a61
    container_name: nextcloud-mariadb
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ./db:/var/lib/mysql
    networks:
      - internal
    environment:
      - TZ=Africa/Cairo
      - MYSQL_ROOT_PASSWORD=${ROOT_PASS}
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}

  redis:
    image: redis:8.8-alpine@sha256:09160599abd229764c0fb44cb6be640294e1d360a54b19985ab4843dcf2d90f1
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - internal

  app:
    image: nextcloud:33.0.5@sha256:96f8b6ad4adf4044ac6d3cbc10ef99b4897c90792782b5b60a5700e5b1b97b84
    container_name: nextcloud
    labels:
      - "dash.description=Self-hosted file sync and cloud storage"
      - "dash.notes=Watched by nextcloud-dynamic-watch.sh"
    restart: unless-stopped
    networks:
      - proxy
      - internal
    depends_on:
      - db
      - redis
    volumes:
      - ./html:/var/www/html
      - /data/nextcloud_data:/var/www/html/data
      - /data/assets:/mnt/external_files
      - ${HOST_CERT_PATH}:/usr/local/share/ca-certificates/homeserver-ca.crt:ro
    entrypoint: /bin/sh -c "update-ca-certificates && exec /entrypoint.sh apache2-foreground"
    environment:
      - TZ=Africa/Cairo
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}
      - MYSQL_HOST=db
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
      - REDIS_HOST=redis

  calcardbackup:
    image: waja/calcardbackup@sha256:f14fa42b3fac674f720aabc001d95b3e17c3aaf4b2aa259480d390f08e26b661
    container_name: calcardbackup
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - db
      - app
    environment:
      - NC_DIR=/var/www/html
      - DB_HOST=db
      - CRON_TIME="59 23 31 12 *"
      - CALCARD_OPTS=-s
    volumes:
      - ./html:/var/www/html:ro
      - /data/assets:/backup
      - /usr/share/zoneinfo/Africa/Cairo:/etc/localtime:ro

networks:
  proxy:
    external: true
  internal:
    internal: true
