services:
  db:
    image: mariadb:13.0@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
    container_name: nextcloud-mariadb
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ./db:/var/lib/mysql
    networks:
      - internal
    environment:
      - TZ=Africa/Cairo
      - MYSQL_ROOT_PASSWORD=${ROOT_PASS}
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}

  redis:
    image: redis:8.10-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - internal

  app:
    image: nextcloud:35.0.2@sha256:786c102155d2717ba0f53a62b3fdd7a1354edc48e800b94dbe32294d9a5752a2
    container_name: nextcloud
    labels:
      - "dash.description=Self-hosted file sync and cloud storage"
      - "dash.notes=Watched by nextcloud-dynamic-watch.sh"
      - "deploy.rollback=false"
    restart: unless-stopped
    networks:
      - proxy
      - internal
    depends_on:
      - db
      - redis
    volumes:
      - ./html:/var/www/html
      - /data/nextcloud_data:/var/www/html/data
      - /data/assets:/mnt/external_files
      - ${HOST_CERT_PATH}:/usr/local/share/ca-certificates/homeserver-ca.crt:ro
    entrypoint: /bin/sh -c "update-ca-certificates && exec /entrypoint.sh apache2-foreground"
    environment:
      - TZ=Africa/Cairo
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}
      - MYSQL_HOST=db
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
      - REDIS_HOST=redis

  calcardbackup:
    image: waja/calcardbackup@sha256:042b0afc69ee137ea480ef9e3d5e2994341cbfab8b729e84decccaf4ead792e1
    container_name: calcardbackup
    restart: unless-stopped
    user: "1000:33"
    entrypoint: ["tail", "-f", "/dev/null"]
    init: true
    networks:
      - internal
    depends_on:
      - db
      - app
    environment:
      - TZ=Africa/Cairo
    volumes:
      - ./html:/var/www/html:ro
      - /data/assets:/backup
      - /usr/share/zoneinfo/Africa/Cairo:/etc/localtime:ro

networks:
  proxy:
    external: true
  internal:
    internal: true
