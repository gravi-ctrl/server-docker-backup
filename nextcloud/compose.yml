services:
  db:
    image: mariadb:11.8@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
    container_name: nextcloud-mariadb
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ./db:/var/lib/mysql
    networks:
      - internal
    environment:
      - TZ=Africa/Cairo
      - MYSQL_ROOT_PASSWORD=${ROOT_PASS}
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}

  redis:
    image: redis:8.10-alpine@sha256:615b4cedaff0c1437a1548acae4222572df8c021eeb7382d64cb8b5e3a13ac7a
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - internal

  app:
    image: nextcloud:34.0.0@sha256:5baecc7baf8991ca0d4b202c349c75c1c83129568284fd1ec6bb7e4417e0a5bb
    container_name: nextcloud
    labels:
      - "dash.description=Self-hosted file sync and cloud storage"
      - "dash.notes=Watched by nextcloud-dynamic-watch.sh"
    restart: unless-stopped
    networks:
      - proxy
      - internal
    depends_on:
      - db
      - redis
    volumes:
      - ./html:/var/www/html
      - /data/nextcloud_data:/var/www/html/data
      - /data/assets:/mnt/external_files
      - ${HOST_CERT_PATH}:/usr/local/share/ca-certificates/homeserver-ca.crt:ro
    entrypoint: /bin/sh -c "update-ca-certificates && exec /entrypoint.sh apache2-foreground"
    environment:
      - TZ=Africa/Cairo
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}
      - MYSQL_HOST=db
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
      - REDIS_HOST=redis

  calcardbackup:
    image: waja/calcardbackup@sha256:14466ac4ca7ef27ffed6edb2e08c2345e928a41d12d359617cae6d6dd9ff975f
    container_name: calcardbackup
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - db
      - app
    environment:
      - NC_DIR=/var/www/html
      - DB_HOST=db
      - CRON_TIME="59 23 31 12 *"
      - CALCARD_OPTS=-s
    volumes:
      - ./html:/var/www/html:ro
      - /data/assets:/backup
      - /usr/share/zoneinfo/Africa/Cairo:/etc/localtime:ro

networks:
  proxy:
    external: true
  internal:
    internal: true
