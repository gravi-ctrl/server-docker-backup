services:
  db:
    image: mariadb:11.8@sha256:7974b628cbb4a37c4108d82f1e1d1123d1857ae3d94ab6fb20b8ad8580c271c8
    container_name: nextcloud-mariadb
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - ./db:/var/lib/mysql
    networks:
      - internal
    environment:
      - TZ=Africa/Cairo
      - MYSQL_ROOT_PASSWORD=${ROOT_PASS}
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}

  redis:
    image: redis:8.6-alpine@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - internal

  app:
    image: nextcloud:33.0.4@sha256:caa40b8beaf0057ac213d8dfc515c36ce64f7a8f0825b6a287e6f7cf2f4a095d
    container_name: nextcloud
    labels:
      - "dash.description=Self-hosted file sync and cloud storage"
      - "dash.notes=Watched by nextcloud-dynamic-watch.sh"
    restart: unless-stopped
    networks:
      - proxy
      - internal
    depends_on:
      - db
      - redis
    volumes:
      - ./html:/var/www/html
      - /data/nextcloud_data:/var/www/html/data
      - /data/assets:/mnt/external_files
      - ${HOST_CERT_PATH}:/usr/local/share/ca-certificates/homeserver-ca.crt:ro
    entrypoint: /bin/sh -c "update-ca-certificates && exec /entrypoint.sh apache2-foreground"
    environment:
      - TZ=Africa/Cairo
      - MYSQL_PASSWORD=${MYSQL_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NC_USER}
      - MYSQL_HOST=db
      - NEXTCLOUD_DATA_DIR=/var/www/html/data
      - REDIS_HOST=redis

  calcardbackup:
    image: waja/calcardbackup@sha256:f14fa42b3fac674f720aabc001d95b3e17c3aaf4b2aa259480d390f08e26b661
    container_name: calcardbackup
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - db
      - app
    environment:
      - NC_DIR=/var/www/html
      - DB_HOST=db
      - CRON_TIME="59 23 31 12 *"
      - CALCARD_OPTS=-s
    volumes:
      - ./html:/var/www/html:ro
      - /data/assets:/backup
      - /usr/share/zoneinfo/Africa/Cairo:/etc/localtime:ro

networks:
  proxy:
    external: true
  internal:
    internal: true
