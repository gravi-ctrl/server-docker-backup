services:
  wud:
    image: fmartinou/whats-up-docker
    container_name: wud
    restart: always
    depends_on:
      - wud-socket-proxy
    networks:
      - wud-net
    ports:
      - 3000:3000
    environment:
      - TZ=Africa/Cairo
      - LOG_LEVEL=info

      # Docker Watcher (TCP Connection)
      - WUD_WATCHER_DOCKER_HOST=wud-socket-proxy
      - WUD_WATCHER_DOCKER_PORT=2375

      # Telegram Notification
      - WUD_TRIGGER_TELEGRAM_BOTTOKEN=${TELE_TOK}
      - WUD_TRIGGER_TELEGRAM_CHATID=${CHAT_ID}

  wud-socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: wud-socket-proxy
    restart: unless-stopped
    networks:
      - wud-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - INFO=1

networks:
  wud-net:
    driver: bridge
